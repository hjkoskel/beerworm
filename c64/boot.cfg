# The boot program. STAGE2 is stored after the code but runs from the cassette
# buffer, because loading the game overwrites $0801 and up.
MEMORY {
    LOADADDR: file = %O, start = $07FF, size = $0002;
    MAIN:     file = %O, start = $0801, size = $0400;
    TAPEBUF:  file = "", start = $033C, size = $00C0;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    CODE:     load = MAIN,     type = ro;
    STAGE2:   load = MAIN,     run = TAPEBUF, type = ro, define = yes;
}
